{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>
    Tags
    <a href="{% url 'tasks:tag-create' %}"
       class="btn btn-primary link-to-page">
      Add
    </a>
  </h1>

  {% if tag_list %}
  <table class="table table-striped table-hover align-middle">

    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Update</th>
        <th scope="col">Delete</th>
      </tr>
    </thead>

    <tbody>
      {% for tag in tag_list %}
        <tr>
          <td> {{ tag.name }}</td>
          <td>
            <a href="{% url 'tasks:tag-update' pk=tag.id %}"
            class="btn btn-secondary">
              Update
            </a>
          </td>
          <td>
            <a href="{% url 'tasks:tag-delete' pk=tag.id %}"
            class="btn btn-secondary">
              Delete
            </a>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>

  {% else %}
    <p>There are no tags in the list.</p>
  {% endif %}

{% endblock %}
